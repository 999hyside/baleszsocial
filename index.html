<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baleszko Social Widget - Twitch First</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: transparent;
            font-family: 'Montserrat', sans-serif;
        }

        .widget-container {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 10, 0.85); 
            border: 1.5px solid rgba(255, 215, 0, 0.5); 
            padding: 0 40px;
            border-radius: 15px;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            min-width: 380px;
            height: 70px;
            animation: floating 4s ease-in-out infinite;
        }

        .widget-container::before, .widget-container::after {
            content: '';
            position: absolute;
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #FFD700, transparent);
        }
        .widget-container::before { top: -1px; }
        .widget-container::after { bottom: -1px; }

        .content-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .info-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            white-space: nowrap;
            /* A teljes körforgás összesen 8 másodperc */
            animation: cycle-info 8s infinite;
        }

        /* Időzítések (2 másodpercenként vált) */
        .info-slide:nth-child(1) { animation-delay: 0s; }
        .info-slide:nth-child(2) { animation-delay: 2s; }
        .info-slide:nth-child(3) { animation-delay: 4s; }
        .info-slide:nth-child(4) { animation-delay: 6s; }

        .icon-box {
            font-size: 32px;
            margin-right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ikon színek */
        .fa-twitch { color: #9146FF; }
        .fa-youtube { color: #FF0000; }
        .fa-instagram { color: #E1306C; }
        .fa-tiktok { color: #ffffff; filter: drop-shadow(2px 0px 0px #fd1d1d) drop-shadow(-2px 0px 0px #25f4ee); }

        .value {
            color: #FFD700;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        @keyframes cycle-info {
            0% { opacity: 0; transform: scale(0.9) translateY(10px); }
            5% { opacity: 1; transform: scale(1) translateY(0); }
            20% { opacity: 1; transform: scale(1) translateY(0); }
            25% { opacity: 0; transform: scale(0.9) translateY(-10px); }
            100% { opacity: 0; }
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .shine {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; border-radius: 15px; pointer-events: none;
        }
        .shine::after {
            content: '';
            position: absolute;
            top: 0; left: -150%; width: 30%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-25deg);
            animation: sweep 4s infinite;
        }
        @keyframes sweep {
            0%, 70% { left: -150%; }
            100% { left: 150%; }
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <div class="shine"></div>
        <div class="content-wrapper">
            
            <div class="info-slide">
                <div class="icon-box"><i class="fab fa-twitch"></i></div>
                <span class="value">Baleszkoo</span>
            </div>

            <div class="info-slide">
                <div class="icon-box"><i class="fab fa-youtube"></i></div>
                <span class="value">Baleszko</span>
            </div>

            <div class="info-slide">
                <div class="icon-box"><i class="fab fa-instagram"></i></div>
                <span class="value">baleszko</span>
            </div>

            <div class="info-slide">
                <div class="icon-box"><i class="fab fa-tiktok"></i></div>
                <span class="value">Baleszko</span>
            </div>

        </div>
    </div>

    <script>
        // Automatikus frissítés 30 percenként
        setTimeout(function(){
            location.reload();
        }, 1800000);
    </script>

</body>
</html>
