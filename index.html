<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Baleszkoo • Social Widget V3</title>
  <style>
    :root { --accent:#a970ff; --accent-rgb:169,112,255; --hold:4800ms; }
    *, *::before, *::after { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent !important; }
    body { display:grid; place-items:center; padding:15px; font-family:Inter,"Segoe UI",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:inherit; text-decoration:none; }
    .widget {
      width:min(100%,380px); height:82px; display:flex; align-items:center; gap:13px;
      padding:0 16px; position:relative; isolation:isolate; border-radius:17px; overflow:hidden;
      border:1px solid rgba(255,255,255,.14);
      background:linear-gradient(115deg,rgba(27,29,43,.98) 0%,rgba(10,12,22,.98) 58%,rgba(18,19,29,.98) 100%);
      box-shadow:0 14px 30px rgba(0,0,0,.36),0 0 26px rgba(var(--accent-rgb),.14),inset 0 1px rgba(255,255,255,.09);
      transition:border-color .6s ease,box-shadow .6s ease;
    }
    .widget::before {
      content:""; position:absolute; inset:0; pointer-events:none; z-index:-1;
      background:radial-gradient(ellipse 155px 90px at 6% 40%,rgba(var(--accent-rgb),.19),transparent 83%);
      transition:background .6s ease;
    }
    .widget::after {
      content:""; position:absolute; top:0; left:12%; width:76%; height:1px;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.24),transparent);
    }
    .icon-wrap {
      width:47px; height:47px; flex:none; border-radius:12px; display:grid; place-items:center;
      color:var(--accent); background:rgba(var(--accent-rgb),.12);
      border:1px solid rgba(var(--accent-rgb),.39);
      box-shadow:inset 0 1px rgba(255,255,255,.08),0 0 17px rgba(var(--accent-rgb),.13);
      transition:color .55s,background .55s,border-color .55s,box-shadow .55s;
    }
    .icon-wrap svg { width:23px; height:23px; display:block; }
    .copy { min-width:0; flex:1; display:flex; flex-direction:column; gap:5px; }
    .eyebrow { display:flex; align-items:center; gap:7px; color:#b7b6c7; font-size:9px; font-weight:750; letter-spacing:1.55px; white-space:nowrap; }
    .dot { width:5px; height:5px; border-radius:50%; flex:none; background:var(--accent); box-shadow:0 0 8px var(--accent); }
    .username { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#fafaff; font-size:19px; font-weight:800; letter-spacing:-.45px; line-height:1.05; }
    .right { min-width:60px; display:flex; align-items:flex-end; flex-direction:column; gap:8px; }
    .pill { color:#c6c3d4; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.035);
      border-radius:6px; padding:5px 7px; font-size:9px; line-height:1; font-weight:800; letter-spacing:1px; }
    .counter { font-size:10px; font-weight:650; color:#77798e; font-variant-numeric:tabular-nums; letter-spacing:1px; }
    .counter b { color:#f4f0ff; font-weight:800; }
    .track { position:absolute; bottom:0; left:0; right:0; height:2px; background:rgba(255,255,255,.075); }
    .fill { height:100%; width:100%; transform:scaleX(0); transform-origin:left center;
      background:linear-gradient(90deg,rgba(var(--accent-rgb),.48),var(--accent));
      box-shadow:0 0 12px var(--accent); }
    .fill.running { animation:progress var(--hold) linear both; }
    .sheen { position:absolute; z-index:3; inset:0; pointer-events:none; transform:translateX(-145%);
      background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.065) 49%,transparent 64%); }
    .widget.arrive .sheen { animation:sweep .9s ease-out both; }
    .widget.leave .icon-wrap,.widget.leave .copy,.widget.leave .right { animation:leave .23s ease-in both; }
    .widget.arrive .icon-wrap { animation:enter .44s cubic-bezier(.2,.8,.2,1) both; }
    .widget.arrive .copy { animation:enter .47s .055s cubic-bezier(.2,.8,.2,1) both; }
    .widget.arrive .right { animation:enter .45s .09s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes progress { to { transform:scaleX(1); } }
    @keyframes leave { to { opacity:0; transform:translateX(-9px); filter:blur(2px); } }
    @keyframes enter { from { opacity:0; transform:translateX(12px); filter:blur(2px); } to { opacity:1; transform:translateX(0); filter:blur(0); } }
    @keyframes sweep { to { transform:translateX(145%); } }
    /* Theme setting: "neon", "glass" or "compact" */
    .widget[data-theme="neon"] { border-color:rgba(var(--accent-rgb),.57);
      box-shadow:0 14px 30px rgba(0,0,0,.4),0 0 28px rgba(var(--accent-rgb),.26),inset 0 1px rgba(255,255,255,.13); }
    .widget[data-theme="neon"] .icon-wrap { box-shadow:0 0 19px rgba(var(--accent-rgb),.25); }
    .widget[data-theme="compact"] { width:min(100%,315px); height:59px; border-radius:40px; padding:0 11px; gap:10px; }
    .widget[data-theme="compact"] .icon-wrap { width:37px; height:37px; border-radius:50%; }
    .widget[data-theme="compact"] .icon-wrap svg { width:19px; height:19px; }
    .widget[data-theme="compact"] .username { font-size:15px; }
    .widget[data-theme="compact"] .eyebrow { font-size:8px; }
    .widget[data-theme="compact"] .right { min-width:35px; }
    .widget[data-theme="compact"] .right .pill { display:none; }
    .widget[data-theme="compact"] .track { left:15px; right:15px; bottom:0; }
    @media (prefers-reduced-motion:reduce) {
      .widget,.icon-wrap,.sheen,.copy,.right,.fill { animation-duration:.01ms !important; transition-duration:.01ms !important; }
    }
  </style>
</head>
<body>
  <a class="widget arrive" id="widget" data-theme="glass" href="https://www.twitch.tv/baleszkoo" target="_blank" rel="noopener noreferrer" aria-label="Baleszkoo közösségi profil">
    <div class="sheen" aria-hidden="true"></div>
    <div class="icon-wrap" id="icon" aria-hidden="true"></div>
    <div class="copy" aria-live="polite">
      <div class="eyebrow"><span class="dot"></span><span id="platform">TWITCH</span></div>
      <div class="username" id="username">Baleszkoo</div>
    </div>
    <div class="right" aria-hidden="true">
      <span class="pill">SOCIALS</span>
      <span class="counter"><b id="current">01</b> / <span id="total">04</span></span>
    </div>
    <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
  </a>
  <script>
    // ===== EZT A RÉSZT SZABHATOD TESTRE =====
    const SETTINGS = {
      theme: "glass",           // glass | neon | compact
      secondsPerProfile: 4.8,    // hány másodpercig látszik egy profil
      profiles: [
        { platform: "TWITCH",   username: "Baleszkoo", icon: "twitch",   color: "#a970ff", url: "https://www.twitch.tv/baleszkoo" },
        { platform: "YOUTUBE",  username: "Baleszko",  icon: "youtube",  color: "#ff525a", url: "https://www.youtube.com/channel/UCRWwoJBBfxxKlSmwjtgcfnA" },
        { platform: "INSTAGRAM",username: "baleszko",  icon: "instagram",color: "#f66aa6", url: "https://www.instagram.com/baleszko/" },
        { platform: "TIKTOK",   username: "Baleszko",  icon: "tiktok",   color: "#55e4e7", url: "https://www.tiktok.com/@baleszkoo" }
        // X profilhoz: {platform:"X / TWITTER",username:"Baleszkoo",icon:"x",color:"#e8e8ef",url:"https://x.com/Baleszkoo_"}
      ]
    };
    // ===== INNENTŐL NEM KELL ÁTÍRNOD =====
    // A beépített SVG ikonok miatt OBS-ben internetkapcsolat nélkül is megjelenik minden.
    const svg = {
      twitch: '<path d="M4 3h17v12l-4 4h-4.5L10 22H7v-3H4V3Zm3 3v10h4v2l2-2h3l2-2V6H7Zm3 2h2v5h-2V8Zm5 0h2v5h-2V8Z"/>',
      youtube:'<path d="M21.8 7.6a3 3 0 0 0-2.1-2.1C17.9 5 12 5 12 5s-5.9 0-7.7.5a3 3 0 0 0-2.1 2.1A31 31 0 0 0 1.8 12c0 1.5.1 3 .4 4.4a3 3 0 0 0 2.1 2.1c1.8.5 7.7.5 7.7.5s5.9 0 7.7-.5a3 3 0 0 0 2.1-2.1c.3-1.4.4-2.9.4-4.4s-.1-3-.4-4.4ZM10 15.4V8.6l6 3.4-6 3.4Z"/>',
      instagram:'<path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7Zm5 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm5.5-2.6a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2Z"/>',
      tiktok:'<path d="M16.7 2h-3v13.1a2.8 2.8 0 1 1-2.8-2.8c.3 0 .6 0 .9.1V9.3a6 6 0 1 0 4.9 5.8V8.2a8.5 8.5 0 0 0 5 1.6v-3a5.5 5.5 0 0 1-5-4.8Z"/>',
      x:'<path d="M18.9 2H22l-6.8 7.8L23.2 22H17l-4.9-7.4L5.6 22H2.4l7.3-8.5L1.8 2H8l4.4 6.8L18.9 2Zm-1.1 18h1.7L7.1 3.9H5.3L17.8 20Z"/>'
    };
    const widget = document.getElementById('widget');
    const icon = document.getElementById('icon');
    const platformEl = document.getElementById('platform');
    const usernameEl = document.getElementById('username');
    const currentEl = document.getElementById('current');
    const totalEl = document.getElementById('total');
    const fill = document.getElementById('fill');
    const profiles = SETTINGS.profiles.filter(p => p && p.platform && p.username);
    const holdMs = Math.max(1500, Number(SETTINGS.secondsPerProfile || 4.8) * 1000);
    let index = 0, timer;
    widget.dataset.theme = ['glass','neon','compact'].includes(SETTINGS.theme) ? SETTINGS.theme : 'glass';
    widget.style.setProperty('--hold', holdMs + 'ms');
    const hexRGB = hex => {
      const h = /^#[0-9a-f]{6}$/i.test(hex) ? hex.slice(1) : 'a970ff';
      return [0,2,4].map(i => parseInt(h.slice(i,i+2),16)).join(',');
    };
    function show(p) {
      const color = /^#[0-9a-f]{6}$/i.test(p.color) ? p.color : '#a970ff';
      widget.style.setProperty('--accent',color);
      widget.style.setProperty('--accent-rgb',hexRGB(color));
      icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' + (svg[p.icon] || svg.twitch) + '</svg>';
      platformEl.textContent = p.platform;
      usernameEl.textContent = p.username;
      currentEl.textContent = String(index+1).padStart(2,'0');
      totalEl.textContent = String(profiles.length).padStart(2,'0');
      widget.href = /^https:\/\//i.test(p.url || '') ? p.url : '#';
      widget.setAttribute('aria-label',p.platform + ': ' + p.username);
      fill.classList.remove('running');
      void fill.offsetWidth;
      fill.classList.add('running');
    }
    function schedule() {
      clearTimeout(timer);
      if (profiles.length < 2) return;
      timer = setTimeout(() => {
        widget.classList.remove('arrive');
        widget.classList.add('leave');
        timer = setTimeout(() => {
          index = (index + 1) % profiles.length;
          show(profiles[index]);
          widget.classList.remove('leave');
          void widget.offsetWidth;
          widget.classList.add('arrive');
          schedule();
        },230);
      },holdMs);
    }
    if (profiles.length) { show(profiles[0]); schedule(); }
    else { widget.style.display='none'; }
  </script>
</body>
</html>
