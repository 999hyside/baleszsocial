<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Social Widget</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .widget {
            display: flex;
            align-items: center;
            background: rgba(12, 12, 16, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 0 20px;
            border-radius: 12px;
            width: 260px;
            height: 46px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .slide {
            position: absolute;
            left: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            opacity: 0;
            animation: switch 16s infinite;
        }

        .slide:nth-child(1) { animation-delay: 0s; }
        .slide:nth-child(2) { animation-delay: 4s; }
        .slide:nth-child(3) { animation-delay: 8s; }
        .slide:nth-child(4) { animation-delay: 12s; }

        .icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            margin-right: 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
        }

        .slide:nth-child(1) .icon { color: #9146FF; }
        .slide:nth-child(2) .icon { color: #FF0000; }
        .slide:nth-child(3) .icon { color: #E1306C; }
        .slide:nth-child(4) .icon { color: #ffffff; }

        .details {
            display: flex;
            flex-direction: column;
        }

        .label {
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1;
            margin-bottom: 3px;
        }

        .username {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.3px;
            line-height: 1;
        }

        @keyframes switch {
            0% { opacity: 0; visibility: hidden; }
            3% { opacity: 1; visibility: visible; }
            22% { opacity: 1; visibility: visible; }
            25% { opacity: 0; visibility: hidden; }
            100% { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>

    <div class="widget">
        <div class="slide">
            <div class="icon"><i class="fab fa-twitch"></i></div>
            <div class="details">
                <span class="label">Twitch</span>
                <span class="username">Baleszkoo</span>
            </div>
        </div>

        <div class="slide">
            <div class="icon"><i class="fab fa-youtube"></i></div>
            <div class="details">
                <span class="label">YouTube</span>
                <span class="username">Baleszko</span>
            </div>
        </div>

        <div class="slide">
            <div class="icon"><i class="fab fa-instagram"></i></div>
            <div class="details">
                <span class="label">Instagram</span>
                <span class="username">baleszko</span>
            </div>
        </div>

        <div class="slide">
            <div class="icon"><i class="fab fa-tiktok"></i></div>
            <div class="details">
                <span class="label">TikTok</span>
                <span class="username">Baleszko</span>
            </div>
        </div>
    </div>

    <script>
        setTimeout(() => location.reload(), 1800000);
    </script>

</body>
</html>
