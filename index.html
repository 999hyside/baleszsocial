<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baleszko Social Widget - Compact & Bold</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .widget-container {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 14, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 0 24px;
            border-radius: 16px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            min-width: 280px;
            height: 52px; /* Kisebb, kompaktabb magasság */
            animation: floating 5s ease-in-out infinite;
        }

        .content-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .info-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center; 
            opacity: 0;
            white-space: nowrap;
            animation: cycle-info 16s infinite;
        }

        .info-slide:nth-child(1) { animation-delay: 0s; }
        .info-slide:nth-child(2) { animation-delay: 4s; }
        .info-slide:nth-child(3) { animation-delay: 8s; }
        .info-slide:nth-child(4) { animation-delay: 12s; }

        .icon-box {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            margin-right: 12px;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .info-slide:nth-child(1) .icon-box { color: #9146FF; border: 1px solid rgba(145, 70, 255, 0.4); }
        .info-slide:nth-child(2) .icon-box { color: #FF0000; border: 1px solid rgba(255, 0, 0, 0.4); }
        .info-slide:nth-child(3) .icon-box { color: #E1306C; border: 1px solid rgba(225, 48, 108, 0.4); }
        .info-slide:nth-child(4) .icon-box { color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.4); }

        .text-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .platform-name {
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 1px;
        }

        .value {
            color: #ffffff;
            font-size: 16px; /* Nagyobb, jobban látható név */
            font-weight: 800;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        @keyframes cycle-info {
            0% { opacity: 0; transform: translateY(6px); filter: blur(3px); }
            8% { opacity: 1; transform: translateY(0); filter: blur(0); }
            22% { opacity: 1; transform: translateY(0); filter: blur(0); }
            30% { opacity: 0; transform: translateY(-6px); filter: blur(3px); }
            100% { opacity: 0; }
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        .shine {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; border-radius: 16px; pointer-events: none;
        }
        .shine::after {
            content: '';
            position: absolute;
            top: 0; left: -150%; width: 40%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            transform: skewX(-20deg);
            animation: sweep 6s infinite ease-in-out;
        }
        @keyframes sweep {
            0%, 60% { left: -150%; }
            100% { left: 150%; }
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <div class="shine"></div>
        <div class="content-wrapper">
            
            <div class="info-slide">
                <div class="icon-box"><i class="fab fa-twitch"></i></div>
                <div class="text-group">
                    <span class="platform-name">Twitch</span>
                    <span class="value">Baleszkoo</span>
                </div>
            </div>

            <div class="info-slide">
                <div class="icon-box"><i class="fab fa-youtube"></i></div>
                <div class="text-group">
                    <span class="platform-name">YouTube</span>
                    <span class="value">Baleszko</span>
                </div>
            </div>

            <div class="info-slide">
                <div class="icon-box"><i class="fab fa-instagram"></i></div>
                <div class="text-group">
                    <span class="platform-name">Instagram</span>
                    <span class="value">baleszko</span>
                </div>
            </div>

            <div class="info-slide">
                <div class="icon-box"><i class="fab fa-tiktok"></i></div>
                <div class="text-group">
                    <span class="platform-name">TikTok</span>
                    <span class="value">Baleszko</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        setTimeout(function(){
            location.reload();
        }, 1800000);
    </script>

</body>
</html>
